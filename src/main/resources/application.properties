spring.application.name=backend-api

# HTTPS (TLS 1.2 / 1.3) — desarrollo local
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/plactica-dev.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=practicaserver
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Puerto HTTP que redirige a HTTPS
server.http.port=8080

# JWT (HMAC) — solo desarrollo local
app.jwt.secret=plactica-dev-secret-key-must-be-at-least-256-bits-long!!
app.jwt.issuer=plactica-backend
app.jwt.expiration-ms=3600000

# CORS para Angular (u otros clientes locales)
app.cors.allowed-origins=http://localhost:4200,https://localhost:4200
